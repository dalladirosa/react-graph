name: Release

# Push a tag like `v0.1.0` to build the Windows executable and publish a GitHub release.
# Can also be started by hand from the Actions tab (it then only uploads the build as an artifact).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $name = "react-graph-${{ github.ref_name }}-windows-x64"
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/react-graph.exe dist/react-graph.exe
          Compress-Archive -Path dist/react-graph.exe -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: react-graph-windows-x64
          path: |
            dist/react-graph.exe
            ${{ env.ASSET }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/react-graph.exe
            ${{ env.ASSET }}
          generate_release_notes: true
