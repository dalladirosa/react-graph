name: Release

# Push a tag like `v0.2.0` to build Windows (installer + portable zip) and macOS Apple Silicon (.dmg)
# and publish them as a GitHub release.
# Can also be started by hand from the Actions tab: it then builds everything and attaches the files
# to the run (plus a screenshot of the Mac app starting up), without publishing a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        shell: bash
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found after install" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/react-graph.exe dist/react-graph.exe
          Compress-Archive -Path dist/react-graph.exe -DestinationPath "dist/react-graph-$env:VERSION-windows-x64-portable.zip"
          & $env:ISCC /Q "/DAppVersion=$env:VERSION" installer/react-graph.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem dist

      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/*-setup.exe
            dist/*.zip

  macos:
    runs-on: macos-15 # Apple Silicon (arm64)
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/tags/* && "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          chmod +x installer/macos/bundle.sh
          installer/macos/bundle.sh "$VERSION" arm64
          ls -la dist

      # Start the bundled app on a sample project and capture the screen, to see that it really runs.
      - name: Smoke test
        continue-on-error: true
        run: |
          "dist/React Graph.app/Contents/MacOS/react-graph" "$PWD/tests/fixtures/memo" &
          pid=$!
          sleep 15
          screencapture -x dist/macos-smoke.png || true
          if kill -0 "$pid" 2>/dev/null; then echo "app is running"; kill "$pid"; else echo "::warning::app exited early"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: |
            dist/*.dmg
            dist/macos-smoke.png
          if-no-files-found: warn

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*-setup.exe
            dist/*-portable.zip
            dist/*.dmg
          generate_release_notes: true
