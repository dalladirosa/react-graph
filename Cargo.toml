[package]
name = "react-graph"
version = "0.5.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
notify = "8"
serde_json = "1"
tree-sitter = "0.27.2"
tree-sitter-typescript = "0.23.2"
walkdir = "2.5.0"

# macOS: compile gpui's Metal shaders at runtime, so building doesn't need Xcode's Metal toolchain
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }

# Debug builds of gpui/lyon are very slow at tessellating paths; optimize deps even in dev.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
embed-resource = "3.0.12"
